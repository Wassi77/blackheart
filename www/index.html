<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Glass Calculator</h1>
        <p class="tagline">Perform quick calculations with a modern, glassmorphism-inspired UI.</p>
        <div class="calculator">
            <div class="display">
                <div class="display__previous" data-previous>&nbsp;</div>
                <div class="display__current" data-current>0</div>
            </div>
            <div class="buttons">
                <button type="button" class="button button--utility" data-action="clear">AC</button>
                <button type="button" class="button button--utility" data-action="backspace">DEL</button>
                <button type="button" class="button button--utility" data-action="percent">%</button>
                <button type="button" class="button button--operator" data-action="operator" data-operator="÷">÷</button>

                <button type="button" class="button" data-digit="7">7</button>
                <button type="button" class="button" data-digit="8">8</button>
                <button type="button" class="button" data-digit="9">9</button>
                <button type="button" class="button button--operator" data-action="operator" data-operator="×">×</button>

                <button type="button" class="button" data-digit="4">4</button>
                <button type="button" class="button" data-digit="5">5</button>
                <button type="button" class="button" data-digit="6">6</button>
                <button type="button" class="button button--operator" data-action="operator" data-operator="−">−</button>

                <button type="button" class="button" data-digit="1">1</button>
                <button type="button" class="button" data-digit="2">2</button>
                <button type="button" class="button" data-digit="3">3</button>
                <button type="button" class="button button--operator" data-action="operator" data-operator="+">+</button>

                <button type="button" class="button button--span-two" data-digit="0">0</button>
                <button type="button" class="button" data-action="decimal">.</button>
                <button type="button" class="button button--equals" data-action="equals">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
